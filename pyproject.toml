[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leg-mri"
version = "0.2.1"
description = "Thigh Dixon MRI segmentation, tissue phenotyping and nested machine learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.11,<1.15", "pandas>=2.1,<2.3",
  "scikit-learn>=1.4,<1.6", "statsmodels>=0.14,<0.15",
  "matplotlib>=3.8,<3.10", "PyYAML>=6,<7", "joblib>=1.3", "openpyxl>=3.1"
]

[project.optional-dependencies]
imaging = ["SimpleITK>=2.3,<2.5", "pydicom>=2.4,<4"]
segmentation = ["torch>=2.4,<2.7", "nnunetv2==2.6.2"]
models = ["xgboost>=2.1,<3", "shap>=0.46,<0.47"]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13", "build>=1.2"]

[project.scripts]
leg-mri = "legmri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
